name: Build Clash Party

on:
  push:
    branches: [ main, master, smart_core ]
  pull_request:
    branches: [ main, master, smart_core ]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - x86_64
        - aarch64
        - armv7

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64, armv7]
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64
            goarch: arm64
          - arch: armv7
            goarch: arm
            goarm: 7
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史，有助于依赖解析
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        # 移除了 cache: true，因为可能没有 go.sum
    
    - name: Check project structure
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== Go Files ==="
        find . -name "*.go" | head -10 || echo "No Go files found"
        echo ""
        echo "=== Go Modules ==="
        if [ -f "go.mod" ]; then
          echo "Found go.mod:"
          cat go.mod
          if [ -f "go.sum" ]; then
            echo "Found go.sum"
          else
            echo "No go.sum found, will generate it"
          fi
        else
          echo "No go.mod found"
        fi
    
    - name: Initialize Go modules (if needed)
      run: |
        if [ ! -f "go.mod" ]; then
          echo "Initializing new Go module..."
          go mod init github.com/${{ github.repository }}
        fi
        # 下载依赖
        go mod tidy
        # 现在应该有 go.sum 了
        ls -la go.* || echo "No Go module files"
    
    - name: Build for ${{ matrix.arch }}
      run: |
        echo "Building for ${{ matrix.arch }} (GOARCH=${{ matrix.goarch }})"
        
        # 设置编译环境
        export GOOS=linux
        export GOARCH=${{ matrix.goarch }}
        export CGO_ENABLED=0
        
        # 设置 ARM 特定的环境变量
        if [ "${{ matrix.arch }}" = "armv7" ]; then
          export GOARM=7
        fi
        
        # 尝试构建主程序
        echo "Building Clash Party..."
        
        # 首先尝试构建整个项目
        if [ -f "go.mod" ]; then
          echo "Building using Go modules..."
          go build -v -trimpath -ldflags="-w -s -X 'github.com/mihomo-party-org/clash-party/constant.Version=1.0.0-${{ github.sha }}'" -o clash-party-${{ matrix.arch }}
        else
          # 如果没有 go.mod，尝试其他构建方式
          echo "No go.mod found, trying alternative build methods..."
          
          # 查找 main 包
          MAIN_FILE=$(find . -name "*.go" -type f -exec grep -l "func main()" {} \; | head -1)
          if [ -n "$MAIN_FILE" ]; then
            echo "Found main in: $MAIN_FILE"
            go build -v -trimpath -ldflags="-w -s" -o clash-party-${{ matrix.arch }} $MAIN_FILE
          else
            # 最后尝试构建所有 Go 文件
            echo "Building all Go files..."
            go build -v -trimpath -ldflags="-w -s" -o clash-party-${{ matrix.arch }} ./...
          fi
        fi
        
        # 检查构建结果
        if [ -f "clash-party-${{ matrix.arch }}" ]; then
          echo "Build successful!"
          file clash-party-${{ matrix.arch }}
          ls -lh clash-party-${{ matrix.arch }}
          # 使用 UPX 压缩（如果可用）
          which upx && upx --best clash-party-${{ matrix.arch }} || echo "UPX not available"
        else
          echo "Build failed - no output file"
          exit 1
        fi
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-${{ matrix.arch }}
        path: clash-party-${{ matrix.arch }}
        retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/smart_core')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: List and verify artifacts
      run: |
        echo "=== Downloaded artifacts ==="
        find . -name "clash-party-*" -type f
        echo ""
        echo "=== File details ==="
        for file in clash-party-*; do
          if [ -f "$file" ]; then
            echo "$file: $(file "$file")"
          fi
        done
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          clash-party-*
        tag_name: build-${{ github.run_id }}
        name: "Clash Party Build ${{ github.run_id }}"
        body: |
          Automated build of Clash Party
          
          **Commit:** ${{ github.sha }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          **Repository:** ${{ github.repository }}
          
          **Available Architectures:**
          - `clash-party-x86_64` - Linux AMD64
          - `clash-party-aarch64` - Linux ARM64  
          - `clash-party-armv7` - Linux ARMv7
          
          **Usage:**
          ```bash
          chmod +x clash-party-<architecture>
          ./clash-party-<architecture>
          ```
          
          **Install on OpenWrt/iStoreOS:**
          ```bash
          # Copy to device and set permissions
          scp clash-party-<architecture> root@192.168.1.1:/usr/bin/clash-party
          ssh root@192.168.1.1 "chmod +x /usr/bin/clash-party"
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
