name: Build Clash Party

on:
  push:
    branches: [ main, master, smart_core ]
  pull_request:
    branches: [ main, master, smart_core ]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - x86_64
        - aarch64
        - armv7

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64, armv7]
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64
            goarch: arm64
          - arch: armv7
            goarch: arm
            goarm: 7
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true
    
    - name: Build for ${{ matrix.arch }}
      run: |
        echo "Building for ${{ matrix.arch }} (GOARCH=${{ matrix.goarch }})"
        
        # 设置编译环境
        export GOOS=linux
        export GOARCH=${{ matrix.goarch }}
        export CGO_ENABLED=0
        
        # 设置 ARM 特定的环境变量
        if [ "${{ matrix.arch }}" = "armv7" ]; then
          export GOARM=7
        fi
        
        # 检查项目结构
        echo "Project structure:"
        find . -name "*.go" | head -10
        ls -la
        
        # 尝试不同的构建方式
        if [ -f "main.go" ]; then
          echo "Building from main.go"
          go build -v -trimpath -ldflags="-w -s" -o clash-party-${{ matrix.arch }}
        elif [ -d "app" ]; then
          echo "Building from app directory"
          cd app
          go build -v -trimpath -ldflags="-w -s" -o ../clash-party-${{ matrix.arch }}
          cd ..
        elif [ -f "Makefile" ]; then
          echo "Building using Makefile"
          make build
          mv clash-party clash-party-${{ matrix.arch }}
        else
          echo "Finding go.mod file"
          go mod download
          go build -v -trimpath -ldflags="-w -s" -o clash-party-${{ matrix.arch }} ./...
        fi
        
        # 检查构建结果
        file clash-party-${{ matrix.arch }}
        ls -lh clash-party-${{ matrix.arch }}
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-${{ matrix.arch }}
        path: clash-party-${{ matrix.arch }}
        retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/smart_core')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: List artifacts
      run: |
        echo "Downloaded artifacts:"
        find . -type f -name "clash-party-*"
        ls -la
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          clash-party-*
        tag_name: build-${{ github.run_id }}
        name: "Clash Party Build ${{ github.run_id }}"
        body: |
          Automated build of Clash Party
          
          **Commit:** ${{ github.sha }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          
          **Files:**
          - `clash-party-x86_64` - AMD64 binary
          - `clash-party-aarch64` - ARM64 binary  
          - `clash-party-armv7` - ARMv7 binary
          
          **Usage:**
          ```bash
          chmod +x clash-party-<arch>
          ./clash-party-<arch>
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
