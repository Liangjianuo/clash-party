name: Build Clash Party

on:
  push:
    branches: [ main, master, smart_core ]
  pull_request:
    branches: [ main, master, smart_core ]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - x86_64
        - aarch64
        - armv7

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64, armv7]
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64
            goarch: arm64
          - arch: armv7
            goarch: arm
            goarm: 7
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go (without cache)
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        # 注意：这里移除了 cache: true
    
    - name: Analyze project structure
      run: |
        echo "=== Project Structure Analysis ==="
        echo "Current directory: $(pwd)"
        echo ""
        echo "Top-level files:"
        ls -la
        echo ""
        echo "Looking for Go files:"
        find . -name "*.go" -type f | head -20
        echo ""
        echo "Looking for main packages:"
        find . -name "*.go" -type f -exec grep -l "package main" {} \; | head -10
        echo ""
        echo "Looking for main functions:"
        find . -name "*.go" -type f -exec grep -l "func main()" {} \; | head -10
    
    - name: Build for ${{ matrix.arch }}
      run: |
        echo "=== Building for ${{ matrix.arch }} ==="
        
        # 设置编译环境
        export GOOS=linux
        export GOARCH=${{ matrix.goarch }}
        export CGO_ENABLED=0
        
        if [ "${{ matrix.arch }}" = "armv7" ]; then
          export GOARM=7
        fi
        
        echo "GOOS: $GOOS"
        echo "GOARCH: $GOARCH"
        echo "GOARM: $GOARM"
        
        # 查找构建入口点
        echo "Finding build entry point..."
        
        # 方法1: 查找包含 main 函数的文件
        MAIN_FILE=$(find . -name "*.go" -type f -exec grep -l "func main()" {} \; | head -1)
        
        if [ -n "$MAIN_FILE" ]; then
          echo "Found main function in: $MAIN_FILE"
          echo "Building from specific main file..."
          go build -v -trimpath -ldflags="-w -s" -o clash-party-${{ matrix.arch }} "$MAIN_FILE"
        else
          # 方法2: 查找包含 package main 的文件
          MAIN_PKG_DIR=$(find . -name "*.go" -type f -exec grep -l "package main" {} \; | xargs dirname | sort -u | head -1)
          
          if [ -n "$MAIN_PKG_DIR" ] && [ "$MAIN_PKG_DIR" != "." ]; then
            echo "Found main package in directory: $MAIN_PKG_DIR"
            echo "Building from package directory..."
            cd "$MAIN_PKG_DIR"
            go build -v -trimpath -ldflags="-w -s" -o ../clash-party-${{ matrix.arch }} .
            cd ..
          else
            # 方法3: 尝试构建当前目录
            echo "Attempting to build current directory..."
            go build -v -trimpath -ldflags="-w -s" -o clash-party-${{ matrix.arch }} .
          fi
        fi
        
        # 验证构建结果
        if [ -f "clash-party-${{ matrix.arch }}" ]; then
          echo "✅ Build successful!"
          echo "File info:"
          file clash-party-${{ matrix.arch }}
          echo "File size:"
          ls -lh clash-party-${{ matrix.arch }}
        else
          echo "❌ Build failed - no output file produced"
          echo "Available files:"
          ls -la
          exit 1
        fi
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-${{ matrix.arch }}
        path: clash-party-${{ matrix.arch }}
        retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/smart_core')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Verify artifacts
      run: |
        echo "=== Downloaded Artifacts ==="
        find . -name "clash-party-*" -type f
        echo ""
        echo "=== File Details ==="
        for file in clash-party-*; do
          echo "📄 $file: $(file "$file") ($(ls -lh "$file" | awk '{print $5}'))"
        done
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          clash-party-*
        tag_name: build-${{ github.run_id }}
        name: "Clash Party Build ${{ github.run_id }}"
        body: |
          Automated build of Clash Party
          
          **Build Info:**
          - Commit: ${{ github.sha }}
          - Build Date: ${{ github.event.head_commit.timestamp }}
          - Repository: ${{ github.repository }}
          
          **Available Binaries:**
          - `clash-party-x86_64` - Linux AMD64
          - `clash-party-aarch64` - Linux ARM64  
          - `clash-party-armv7` - Linux ARMv7
          
          **Usage:**
          ```bash
          # Make executable and run
          chmod +x clash-party-<architecture>
          ./clash-party-<architecture>
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
