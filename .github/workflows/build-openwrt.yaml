name: Build OpenWrt Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 这行允许手动触发
    inputs:
      version:
        description: 'Clash Party version'
        required: true
        default: 'latest'
      target_arch:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
        - x86_64
        - aarch64
        - armv7

jobs:
  build-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64, armv7]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true
    
    - name: Build Clash Party binary
      run: |
        # 创建输出目录
        mkdir -p build/${{ matrix.arch }}
        
        # 设置 Go 环境变量
        export GOOS=linux
        export CGO_ENABLED=0
        
        # 根据架构设置 GOARCH
        case "${{ matrix.arch }}" in
          "x86_64")
            export GOARCH=amd64
            ;;
          "aarch64")
            export GOARCH=arm64
            ;;
          "armv7")
            export GOARCH=arm
            export GOARM=7
            ;;
        esac
        
        echo "Building for $GOOS/$GOARCH"
        
        # 编译 Clash Party
        cd app
        go build -trimpath -ldflags="-w -s -X 'github.com/mihomo-party-org/clash-party/constant.Version=1.0.0'" -o ../build/${{ matrix.arch }}/clash-party
        
        # 验证编译结果
        file ../build/${{ matrix.arch }}/clash-party
        ls -la ../build/${{ matrix.arch }}/

    - name: Upload binary artifacts
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-binary-${{ matrix.arch }}
        path: build/${{ matrix.arch }}/clash-party
        retention-days: 7

  build-openwrt-package:
    runs-on: ubuntu-latest
    needs: build-binary
    strategy:
      matrix:
        arch: [x86_64, aarch64, armv7]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: clash-party-binary-${{ matrix.arch }}
        path: binary/
    
    - name: Set up OpenWrt SDK environment
      run: |
        # 安装必要的工具
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext \
          zlib1g-dev swig unzip time python3 python3-setuptools rsync
        
        # 创建 OpenWrt 包结构
        mkdir -p openwrt-package/package/clash-party
        
        # 创建 Makefile
        cat > openwrt-package/package/clash-party/Makefile << 'EOF'
        include $(TOPDIR)/rules.mk

        PKG_NAME:=clash-party
        PKG_VERSION:=1.0.0
        PKG_RELEASE:=1

        PKG_MAINTAINER:=Clash Party Team
        PKG_LICENSE:=MIT
        PKG_LICENSE_FILES:=LICENSE

        include $(INCLUDE_DIR)/package.mk

        define Package/clash-party
          SECTION:=net
          CATEGORY:=Network
          SUBMENU:=Web Servers/Proxies
          TITLE:=Clash Party - Enhanced Clash Proxy
          URL:=https://github.com/mihomo-party-org/clash-party
          DEPENDS:=+kmod-tun
        endef

        define Package/clash-party/description
          Clash Party is an enhanced version of Clash proxy with party features.
          Based on Mihomo (Clash Meta) with additional functionality.
        endef

        define Build/Prepare
        endef

        define Build/Configure
        endef

        define Build/Compile
        endef

        define Package/clash-party/install
        	$(INSTALL_DIR) $(1)/usr/bin
        	$(INSTALL_BIN) ./files/clash-party $(1)/usr/bin/clash-party
        	
        	$(INSTALL_DIR) $(1)/etc/init.d
        	$(INSTALL_BIN) ./files/clash-party.init $(1)/etc/init.d/clash-party
        	
        	$(INSTALL_DIR) $(1)/etc/config
        	$(INSTALL_CONF) ./files/clash-party.conf $(1)/etc/config/clash-party
        endef

        $(eval $(call BuildPackage,clash-party))
        EOF
        
        # 创建必要的目录和文件
        mkdir -p openwrt-package/package/clash-party/files
        
        # 复制二进制文件
        cp binary/clash-party openwrt-package/package/clash-party/files/
        chmod +x openwrt-package/package/clash-party/files/clash-party
        
        # 创建 init 脚本
        cat > openwrt-package/package/clash-party/files/clash-party.init << 'EOF'
        #!/bin/sh /etc/rc.common
        
        START=99
        USE_PROCD=1
        
        start_service() {
            procd_open_instance
            procd_set_param command /usr/bin/clash-party -d /etc/clash-party
            procd_set_param respawn
            procd_set_param stdout 1
            procd_set_param stderr 1
            procd_close_instance
        }
        
        stop_service() {
            killall clash-party
        }
        EOF
        
        # 创建配置文件
        cat > openwrt-package/package/clash-party/files/clash-party.conf << 'EOF'
        config global
            option enabled '0'
            option config_path '/etc/clash-party/config.yaml'
        EOF

    - name: Create IPK package structure
      run: |
        # 创建包目录结构
        mkdir -p ipk-build/control
        mkdir -p ipk-build/data/usr/bin
        mkdir -p ipk-build/data/etc/init.d
        mkdir -p ipk-build/data/etc/config
        
        # 复制文件
        cp binary/clash-party ipk-build/data/usr/bin/
        chmod +x ipk-build/data/usr/bin/clash-party
        cp openwrt-package/package/clash-party/files/clash-party.init ipk-build/data/etc/init.d/clash-party
        chmod +x ipk-build/data/etc/init.d/clash-party
        cp openwrt-package/package/clash-party/files/clash-party.conf ipk-build/data/etc/config/clash-party
        
        # 创建 control 文件
        cat > ipk-build/control/control << EOF
        Package: clash-party
        Version: 1.0.0-1
        Depends: kmod-tun
        Architecture: ${{ matrix.arch }}
        Maintainer: Clash Party Team
        Section: net
        Priority: optional
        Description: Clash Party - Enhanced Clash Proxy
        Source: https://github.com/mihomo-party-org/clash-party
        EOF
        
        # 创建 debian-binary 文件
        echo "2.0" > ipk-build/debian-binary

    - name: Build IPK package
      run: |
        cd ipk-build
        
        # 创建 control.tar.gz
        tar czf control.tar.gz control/
        
        # 创建 data.tar.gz
        tar czf data.tar.gz data/
        
        # 创建最终的 ipk 文件
        ar r clash-party_1.0.0-1_${{ matrix.arch }}.ipk debian-binary control.tar.gz data.tar.gz
        
        # 验证 ipk 文件
        file clash-party_1.0.0-1_${{ matrix.arch }}.ipk
        ls -la *.ipk

    - name: Upload IPK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-ipk-${{ matrix.arch }}
        path: ipk-build/clash-party_1.0.0-1_${{ matrix.arch }}.ipk
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [build-binary, build-openwrt-package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Display structure of downloaded files
      run: ls -R
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          **/*.ipk
          **/clash-party
        tag_name: v1.0.0-${{ github.run_id }}
        name: Clash Party v1.0.0
        body: |
          Clash Party OpenWrt/iStoreOS Packages
          
          Built from: ${{ github.sha }}
          
          **Architectures:**
          - x86_64
          - aarch64  
          - armv7
          
          **Installation:**
          ```bash
          opkg install clash-party_1.0.0-1_<arch>.ipk
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
