name: Build Clash Party (x86_64 only)

on:
  push:
    branches: [ main, master, smart_core ]
  pull_request:
    branches: [ main, master, smart_core ]
  workflow_dispatch:
    inputs:
      skip_analysis:
        description: 'Skip project analysis'
        required: false
        default: false
        type: boolean

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
      # 完全移除 cache 配置
    
    - name: Project analysis
      if: ${{ !inputs.skip_analysis }}
      run: |
        echo "=== Clash Party Project Analysis ==="
        echo ""
        echo "📁 Current directory: $(pwd)"
        echo ""
        echo "📄 Top-level files:"
        ls -la
        echo ""
        echo "🔍 Go files structure:"
        find . -name "*.go" -type f | head -15
        echo ""
        echo "🎯 Main package search:"
        find . -name "*.go" -type f -exec grep -l "package main" {} \; | while read file; do
          echo "Main package found: $file"
          # 检查是否有 main 函数
          if grep -q "func main()" "$file"; then
            echo "  ✅ Contains func main()"
          else
            echo "  ❌ No func main() found"
          fi
        done
        echo ""
        echo "🏗️ Build entry points:"
        find . -name "*.go" -type f -exec grep -l "func main()" {} \; | head -5
    
    - name: Build for x86_64
      run: |
        echo "=== Building Clash Party for x86_64 ==="
        
        # 设置编译环境
        export GOOS=linux
        export GOARCH=amd64
        export CGO_ENABLED=0
        
        echo "Build environment:"
        echo "GOOS: $GOOS"
        echo "GOARCH: $GOARCH"
        echo "CGO_ENABLED: $CGO_ENABLED"
        echo ""
        
        # 方法1: 首先尝试构建整个项目
        echo "🔧 Method 1: Building current directory..."
        if go build -v -trimpath -ldflags="-w -s" -o clash-party-x86_64 . 2>&1; then
          echo "✅ Method 1 succeeded!"
        else
          echo "❌ Method 1 failed, trying alternative methods..."
          
          # 方法2: 查找并构建包含 main 函数的文件
          echo ""
          echo "🔧 Method 2: Searching for main function..."
          MAIN_FILE=$(find . -name "*.go" -type f -exec grep -l "func main()" {} \; | head -1)
          
          if [ -n "$MAIN_FILE" ]; then
            echo "Found main in: $MAIN_FILE"
            echo "Building specific file..."
            if go build -v -trimpath -ldflags="-w -s" -o clash-party-x86_64 "$MAIN_FILE" 2>&1; then
              echo "✅ Method 2 succeeded!"
            else
              echo "❌ Method 2 failed"
              exit 1
            fi
          else
            echo "❌ No main function found"
            exit 1
          fi
        fi
        
        echo ""
        echo "=== Build Results ==="
        if [ -f "clash-party-x86_64" ]; then
          echo "🎉 Build successful!"
          echo "📊 File information:"
          file clash-party-x86_64
          echo "💾 File size: $(ls -lh clash-party-x86_64 | awk '{print $5}')"
          echo "🔍 Detailed info:"
          ls -la clash-party-x86_64
        else
          echo "💥 Build failed - no output file created"
          echo "Available files in directory:"
          ls -la
          exit 1
        fi
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-x86_64
        path: clash-party-x86_64
        retention-days: 30
    
    - name: Create GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/smart_core')
      uses: softprops/action-gh-release@v1
      with:
        files: clash-party-x86_64
        tag_name: x86_64-build-${{ github.run_id }}
        name: "Clash Party x86_64 Build"
        body: |
          Clash Party x86_64 Linux Binary
          
          **Build Information:**
          - Commit: ${{ github.sha }}
          - Build Date: ${{ github.event.head_commit.timestamp }}
          - Architecture: x86_64 (AMD64)
          - Repository: ${{ github.repository }}
          
          **Usage:**
          ```bash
          # Download and make executable
          chmod +x clash-party-x86_64
          
          # Run directly
          ./clash-party-x86_64
          
          # Or install to system path
          sudo mv clash-party-x86_64 /usr/local/bin/clash-party
          ```
          
          **OpenWrt/iStoreOS Installation:**
          ```bash
          # Copy to router
          scp clash-party-x86_64 root@192.168.1.1:/usr/bin/clash-party
          
          # Set permissions
          ssh root@192.168.1.1 "chmod +x /usr/bin/clash-party"
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
