name: Build OpenWrt/iStoreOS Package (x86_64) - Fixed

on:
  push:
    branches: [ main, master, smart_core ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version'
        required: true
        default: '1.0.0'

jobs:
  build-package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup environment
      run: |
        echo "=== Preparing Build Environment ==="
        sudo apt-get update
        sudo apt-get install -y build-essential wget curl tar gzip ar
    
    - name: Create package structure
      run: |
        echo "=== Creating Package Structure ==="
        
        # 创建简单的目录结构
        mkdir -p package/usr/bin
        mkdir -p package/etc/init.d
        mkdir -p package/etc/config
        mkdir -p package/etc/clash-party
        
        # 创建 init 脚本
        cat > package/etc/init.d/clash-party << 'EOF'
#!/bin/sh /etc/rc.common

START=99
USE_PROCD=1

start_service() {
    procd_open_instance
    procd_set_param command /usr/bin/clash-party
    procd_set_param respawn
    procd_set_param stdout 1
    procd_set_param stderr 1
    procd_close_instance
}

stop_service() {
    killall clash-party
}
EOF
        chmod +x package/etc/init.d/clash-party
        
        # 创建配置文件
        cat > package/etc/config/clash-party << 'EOF'
config clash-party 'main'
    option enabled '0'
    option config_path '/etc/clash-party/config.yaml'
EOF
        
        # 创建示例配置
        cat > package/etc/clash-party/config.yaml << 'EOF'
port: 7890
socks-port: 7891
mixed-port: 7893
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
EOF

    - name: Download Clash binary
      run: |
        echo "=== Downloading Clash Binary ==="
        cd package/usr/bin
        
        # 尝试多个下载源
        echo "尝试下载 Clash 二进制文件..."
        
        # 方法1: 尝试下载最新发布的 mihomo
        if wget -q --spider "https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64.tar.gz"; then
          echo "下载最新版 mihomo..."
          wget -q "https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64.tar.gz"
          tar -xzf mihomo-linux-amd64.tar.gz
          [ -f "mihomo" ] && mv mihomo clash-party
          rm -f mihomo-linux-amd64.tar.gz
        # 方法2: 尝试特定版本
        elif wget -q --spider "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.0/mihomo-linux-amd64-v1.18.0.tar.gz"; then
          echo "下载 v1.18.0 版本..."
          wget -q "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.0/mihomo-linux-amd64-v1.18.0.tar.gz"
          tar -xzf mihomo-linux-amd64-v1.18.0.tar.gz
          [ -f "mihomo" ] && mv mihomo clash-party
          rm -f mihomo-linux-amd64-v1.18.0.tar.gz
        else
          echo "所有下载尝试失败，创建占位程序"
          # 创建占位二进制文件
          cat > clash-party << 'EOF'
#!/bin/sh
echo "=========================================="
echo "Clash Party - OpenWrt Package"
echo "=========================================="
echo "This is a placeholder binary."
echo "Please download the actual Clash binary from:"
echo "https://github.com/MetaCubeX/mihomo/releases"
echo ""
echo "Replace /usr/bin/clash-party with the actual binary"
echo "=========================================="
sleep 10
exit 0
EOF
        fi
        
        chmod +x clash-party
        echo "二进制文件详情:"
        file clash-party
        ls -la clash-party

    - name: Build IPK package
      run: |
        echo "=== Building IPK Package ==="
        
        # 创建构建目录
        mkdir -p ipk-build/control
        mkdir -p ipk-build/data
        
        # 复制文件到数据目录
        cp -r package/* ipk-build/data/
        
        # 创建 control 文件
        cat > ipk-build/control/control << 'EOF'
Package: clash-party
Version: 1.0.0-1
Depends: kmod-tun
Architecture: x86_64
Maintainer: Clash Party
Section: net
Priority: optional
Description: Clash Party - Enhanced Clash Proxy
Source: https://github.com/Liangjianuo/clash-party
EOF
        
        # 创建安装脚本
        cat > ipk-build/control/postinst << 'EOF'
#!/bin/sh
[ -n "$IPKG_INSTROOT" ] || {
    echo "Enabling clash-party service..."
    /etc/init.d/clash-party enable
    echo "Clash Party installed successfully!"
    echo "Note: You may need to replace /usr/bin/clash-party with actual binary"
}
exit 0
EOF
        chmod +x ipk-build/control/postinst
        
        # 创建卸载脚本
        cat > ipk-build/control/prerm << 'EOF'
#!/bin/sh
[ -n "$IPKG_INSTROOT" ] || {
    echo "Stopping clash-party service..."
    /etc/init.d/clash-party stop
    /etc/init.d/clash-party disable
}
exit 0
EOF
        chmod +x ipk-build/control/prerm
        
        # 创建 IPK 包
        echo "2.0" > ipk-build/debian-binary
        
        # 打包 control
        cd ipk-build/control
        tar czf ../control.tar.gz .
        cd ..
        
        # 打包 data
        cd ipk-build/data
        tar czf ../data.tar.gz .
        cd ..
        
        # 创建最终的 ipk 文件
        ar r clash-party_1.0.0-1_x86_64.ipk debian-binary control.tar.gz data.tar.gz
        
        echo "=== IPK 文件创建完成 ==="
        file clash-party_1.0.0-1_x86_64.ipk
        ls -lh *.ipk
        
        # 确保文件在正确的位置
        cp clash-party_1.0.0-1_x86_64.ipk ../
        cd ..
        
        echo "=== 最终文件位置 ==="
        pwd
        ls -la *.ipk

    - name: Verify and debug
      run: |
        echo "=== 验证文件 ==="
        echo "当前目录: $(pwd)"
        echo "文件列表:"
        ls -la
        
        if [ -f "clash-party_1.0.0-1_x86_64.ipk" ]; then
          echo "✅ IPK 文件找到: clash-party_1.0.0-1_x86_64.ipk"
          echo "文件大小: $(ls -lh clash-party_1.0.0-1_x86_64.ipk | awk '{print $5}')"
          echo "文件类型: $(file clash-party_1.0.0-1_x86_64.ipk)"
        else
          echo "❌ IPK 文件未找到!"
          echo "搜索所有 IPK 文件:"
          find . -name "*.ipk" -type f
          exit 1
        fi

    - name: Upload IPK artifact
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-openwrt-x86_64
        path: clash-party_1.0.0-1_x86_64.ipk
        retention-days: 30

    - name: Create GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/smart_core')
      uses: softprops/action-gh-release@v1
      with:
        files: clash-party_1.0.0-1_x86_64.ipk
        tag_name: openwrt-${{ github.run_number }}
        name: "Clash Party OpenWrt Package v1.0.0"
        body: |
          # Clash Party OpenWrt/iStoreOS Package
          
          **架构**: x86_64
          **版本**: 1.0.0-1
          **构建时间**: ${{ github.event.head_commit.timestamp }}
          
          ## 安装说明
          
          ```bash
          # 上传到路由器
          scp clash-party_1.0.0-1_x86_64.ipk root@192.168.1.1:/tmp/
          
          # 安装包
          opkg update
          opkg install /tmp/clash-party_1.0.0-1_x86_64.ipk
          
          # 启用服务
          /etc/init.d/clash-party enable
          /etc/init.d/clash-party start
          ```
          
          ## 配置文件
          - 服务配置: `/etc/config/clash-party`
          - 主配置文件: `/etc/clash-party/config.yaml`
          - 二进制文件: `/usr/bin/clash-party`
          
          ## 注意事项
          ⚠️ 这个包包含一个占位二进制文件。请从以下地址下载实际的 Clash 二进制文件并替换 `/usr/bin/clash-party`：
          https://github.com/MetaCubeX/mihomo/releases
          
          ## 服务管理
          ```bash
          # 启动服务
          /etc/init.d/clash-party start
          
          # 停止服务  
          /etc/init.d/clash-party stop
          
          # 重启服务
          /etc/init.d/clash-party restart
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
