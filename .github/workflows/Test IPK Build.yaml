name: Build OpenWrt Package - Working

on:
  push:
    branches: [ main, master, smart_core ]
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget curl tar gzip ar
    
    - name: Create package structure
      run: |
        echo "=== Creating Package Structure ==="
        
        # 在工作区根目录创建包结构
        mkdir -p package-files/usr/bin
        mkdir -p package-files/etc/init.d
        mkdir -p package-files/etc/config
        mkdir -p package-files/etc/clash-party
        
        # 创建 init 脚本
        cat > package-files/etc/init.d/clash-party << 'EOF'
#!/bin/sh /etc/rc.common

START=99
USE_PROCD=1

start_service() {
    procd_open_instance
    procd_set_param command /usr/bin/clash-party
    procd_set_param respawn
    procd_set_param stdout 1
    procd_set_param stderr 1
    procd_close_instance
}

stop_service() {
    killall clash-party
}
EOF
        chmod +x package-files/etc/init.d/clash-party
        
        # 创建配置文件
        cat > package-files/etc/config/clash-party << 'EOF'
config clash-party 'main'
    option enabled '0'
    option config_path '/etc/clash-party/config.yaml'
EOF
        
        # 创建示例配置
        cat > package-files/etc/clash-party/config.yaml << 'EOF'
port: 7890
socks-port: 7891
mixed-port: 7893
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
EOF

    - name: Download Clash binary
      run: |
        echo "=== Downloading Clash Binary ==="
        cd package-files/usr/bin
        
        # 创建占位二进制文件
        cat > clash-party << 'EOF'
#!/bin/sh
echo "=================================================="
echo "Clash Party - OpenWrt Package"
echo "=================================================="
echo "This package is successfully installed!"
echo ""
echo "To use actual Clash functionality, please:"
echo "1. Download the real Clash binary from:"
echo "   https://github.com/MetaCubeX/mihomo/releases"
echo "2. Replace /usr/bin/clash-party with the real binary"
echo "3. Configure /etc/clash-party/config.yaml"
echo "4. Start service: /etc/init.d/clash-party start"
echo "=================================================="
exit 0
EOF
        chmod +x clash-party
        
        echo "Binary created:"
        file clash-party
        ls -la clash-party

    - name: Build IPK package
      run: |
        echo "=== Building IPK Package ==="
        
        # 在工作区根目录创建构建目录
        mkdir -p ipk-build/control
        mkdir -p ipk-build/data
        
        # 复制文件到数据目录
        cp -r package-files/* ipk-build/data/
        
        # 创建 control 文件
        cat > ipk-build/control/control << 'EOF'
Package: clash-party
Version: 1.0.0-1
Depends: kmod-tun
Architecture: x86_64
Maintainer: Clash Party
Section: net
Priority: optional
Description: Clash Party - Enhanced Clash Proxy
Source: https://github.com/Liangjianuo/clash-party
EOF
        
        # 创建安装后脚本
        cat > ipk-build/control/postinst << 'EOF'
#!/bin/sh
[ -n "$IPKG_INSTROOT" ] || {
    echo "=========================================="
    echo "Clash Party Service Enabled"
    echo "=========================================="
    /etc/init.d/clash-party enable
    echo "Service: /etc/init.d/clash-party"
    echo "Config: /etc/config/clash-party" 
    echo "Binary: /usr/bin/clash-party"
    echo "=========================================="
}
exit 0
EOF
        chmod +x ipk-build/control/postinst
        
        # 创建卸载前脚本
        cat > ipk-build/control/prerm << 'EOF'
#!/bin/sh
[ -n "$IPKG_INSTROOT" ] || {
    /etc/init.d/clash-party stop
    /etc/init.d/clash-party disable
}
exit 0
EOF
        chmod +x ipk-build/control/prerm
        
        # 创建 debian-binary 文件
        echo "2.0" > ipk-build/debian-binary
        
        # 创建 control.tar.gz
        cd ipk-build/control
        tar czf ../control.tar.gz .
        cd ..
        
        # 创建 data.tar.gz
        cd ipk-build/data
        tar czf ../data.tar.gz .
        cd ..
        
        # 创建最终的 ipk 文件 - 直接在工作区根目录
        cd ipk-build
        ar r ../clash-party_1.0.0-1_x86_64.ipk debian-binary control.tar.gz data.tar.gz
        cd ..
        
        echo "=== IPK File Created ==="
        ls -la *.ipk
        file *.ipk

    - name: Debug file location
      run: |
        echo "=== Debug File Location ==="
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo ""
        echo "Searching for IPK files:"
        find . -name "*.ipk" -type f
        echo ""
        if [ -f "clash-party_1.0.0-1_x86_64.ipk" ]; then
          echo "✅ SUCCESS: IPK file found!"
          echo "File path: $(pwd)/clash-party_1.0.0-1_x86_64.ipk"
          echo "File size: $(ls -lh clash-party_1.0.0-1_x86_64.ipk | awk '{print $5}')"
          echo "File type: $(file clash-party_1.0.0-1_x86_64.ipk)"
        else
          echo "❌ ERROR: IPK file not found in current directory!"
          echo "Creating a test file to verify upload..."
          echo "Test file content" > test-file.txt
          ls -la *.txt
        fi

    - name: Upload IPK artifact
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-openwrt-x86_64
        path: clash-party_1.0.0-1_x86_64.ipk
        retention-days: 30

    - name: Create GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/smart_core')
      uses: softprops/action-gh-release@v1
      with:
        files: clash-party_1.0.0-1_x86_64.ipk
        tag_name: openwrt-v1.0.0-${{ github.run_number }}
        name: "Clash Party OpenWrt Package v1.0.0"
        body: |
          # Clash Party OpenWrt/iStoreOS Package
          
          **架构**: x86_64  
          **版本**: 1.0.0-1
          **Commit**: ${{ github.sha }}
          
          ## 安装说明
          
          ```bash
          # 上传到路由器
          scp clash-party_1.0.0-1_x86_64.ipk root@192.168.1.1:/tmp/
          
          # 安装包
          opkg update
          opkg install /tmp/clash-party_1.0.0-1_x86_64.ipk
          
          # 启用服务
          /etc/init.d/clash-party enable
          ```
          
          ## 文件位置
          - 服务脚本: `/etc/init.d/clash-party`
          - 配置: `/etc/config/clash-party`
          - 主配置: `/etc/clash-party/config.yaml`
          - 二进制: `/usr/bin/clash-party`
          
          ## 注意
          ⚠️ 此包包含占位二进制文件，请从 [Mihomo Releases](https://github.com/MetaCubeX/mihomo/releases) 下载实际 Clash 二进制文件替换 `/usr/bin/clash-party`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
