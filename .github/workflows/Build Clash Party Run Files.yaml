name: Build OpenWrt/iStoreOS Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0.0'

env:
  APP_ID: party.mihomo.app
  PRODUCT_NAME: Clash Party

jobs:
  build-openwrt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install dependencies
      run: |
        pnpm install

    - name: Build Electron app for Linux
      run: |
        pnpm run build

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget file

    - name: Create package structure
      run: |
        mkdir -p openwrt-build/package/clash-party/CONTROL
        mkdir -p openwrt-build/package/clash-party/usr/bin
        mkdir -p openwrt-build/package/clash-party/usr/share/clash-party
        mkdir -p openwrt-build/package/clash-party/usr/share/applications
        mkdir -p openwrt-build/package/clash-party/usr/share/icons/hicolor/256x256/apps

    - name: Copy built files
      run: |
        # 复制可执行文件
        if [ -f "dist/linux-unpacked/clash-party" ]; then
          cp dist/linux-unpacked/clash-party openwrt-build/package/clash-party/usr/bin/
          chmod +x openwrt-build/package/clash-party/usr/bin/clash-party
        else
          echo "错误: 未找到构建的可执行文件"
          ls -la dist/ || echo "dist 目录不存在"
          ls -la dist/linux-unpacked/ || echo "linux-unpacked 目录不存在"
          exit 1
        fi

        # 复制资源文件
        if [ -d "dist/linux-unpacked/resources" ]; then
          cp -r dist/linux-unpacked/resources/* openwrt-build/package/clash-party/usr/share/clash-party/
        fi

        # 创建默认图标
        mkdir -p openwrt-build/package/clash-party/usr/share/icons/hicolor/256x256/apps/
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" | base64 -d > openwrt-build/package/clash-party/usr/share/icons/hicolor/256x256/apps/clash-party.png

    - name: Create desktop file
      run: |
        cat > openwrt-build/package/clash-party/usr/share/applications/clash-party.desktop << 'EOF'
[Desktop Entry]
Version=1.0
Type=Application
Name=Clash Party
Comment=Clash Party Client
Exec=/usr/bin/clash-party
Icon=/usr/share/icons/hicolor/256x256/apps/clash-party.png
Terminal=false
StartupWMClass=Clash Party
Categories=Network;Utility;
MimeType=x-scheme-handler/clash;x-scheme-handler/mihomo;
EOF

    - name: Create control file
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION=${VERSION#v}
        
        # 计算安装大小
        INSTALLED_SIZE=$(du -sk openwrt-build/package/clash-party/usr | cut -f1)
        
        cat > openwrt-build/package/clash-party/CONTROL/control << EOF
Package: clash-party
Version: ${VERSION}
Depends: libc
Source: https://github.com/${{ github.repository }}
Section: utils
Architecture: ${{ matrix.arch }}
Installed-Size: ${INSTALLED_SIZE}
Maintainer: mihomo-party-org
Description: Clash Party - A feature-rich Clash client
 A modern Clash client with rich features and user-friendly interface.
EOF

    - name: Create postinst script
      run: |
        cat > openwrt-build/package/clash-party/CONTROL/postinst << 'EOF'
#!/bin/sh
set -e
if command -v update-desktop-database >/dev/null 2>&1; then
    update-desktop-database -q /usr/share/applications 2>/dev/null || true
fi
if command -v update-mime-database >/dev/null 2>&1; then
    update-mime-database /usr/share/mime 2>/dev/null || true
fi
if command -v xdg-mime >/dev/null 2>&1; then
    xdg-mime default clash-party.desktop x-scheme-handler/clash 2>/dev/null || true
    xdg-mime default clash-party.desktop x-scheme-handler/mihomo 2>/dev/null || true
fi
exit 0
EOF
        chmod +x openwrt-build/package/clash-party/CONTROL/postinst

    - name: Create postrm script
      run: |
        cat > openwrt-build/package/clash-party/CONTROL/postrm << 'EOF'
#!/bin/sh
set -e
if command -v update-desktop-database >/dev/null 2>&1; then
    update-desktop-database -q /usr/share/applications 2>/dev/null || true
fi
if command -v update-mime-database >/dev/null 2>&1; then
    update-mime-database /usr/share/mime 2>/dev/null || true
fi
exit 0
EOF
        chmod +x openwrt-build/package/clash-party/CONTROL/postrm

    - name: Download ipkg-build script
      run: |
        wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O ipkg-build
        chmod +x ipkg-build
        sed -i 's/`which ar`/ar/g' ipkg-build
        sed -i 's/`which tar`/tar/g' ipkg-build

    - name: Build IPK package
      run: |
        cd openwrt-build/package/clash-party
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION=${VERSION#v}
        
        # 构建 IPK
        ../../../ipkg-build ./
        
        # 重命名 IPK 文件
        for ipk in *.ipk; do
          new_name="clash-party-${VERSION}-${{ matrix.arch }}.ipk"
          mv "$ipk" "$new_name"
          echo "构建完成: $new_name"
        done

    - name: List built files
      run: |
        echo "构建的文件:"
        ls -la openwrt-build/package/clash-party/*.ipk || echo "未找到 IPK 文件"

    - name: Upload IPK to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: openwrt-build/package/clash-party/*.ipk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload IPK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-${{ matrix.arch }}
        path: openwrt-build/package/clash-party/*.ipk
        retention-days: 30
