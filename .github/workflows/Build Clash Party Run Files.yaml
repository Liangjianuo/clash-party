name: Build OpenWrt iStoreOS Package

on:
  push:
    tags:
      - v*
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

permissions: write-all

jobs:
  build-openwrt:
    name: Build OpenWrt iStoreOS (x86_64)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget unzip libncurses5-dev \
            zlib1g-dev gawk gettext libssl-dev xsltproc rsync python3 python3-distutils

      - name: Clone iStoreOS OpenWrt SDK (x86_64)
        run: |
          mkdir -p openwrt-sdk
          cd openwrt-sdk
          # 推荐使用官方 SDK 分支（替换为当前 iStoreOS 对应版本）
          wget https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-*.tar.xz --strip=1

      - name: Prepare feed and Makefile
        run: |
          cd openwrt-sdk
          echo "src-link local $(pwd)/../../" > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/mypackage
          cp -r ../../package/* package/mypackage/ || true

      - name: Configure build
        run: |
          cd openwrt-sdk
          make defconfig

      - name: Build ipk
        run: |
          cd openwrt-sdk
          make package/mypackage/compile V=s
          mkdir -p ../../dist
          find bin/packages/x86_64/ -type f -name "*.ipk" -exec cp {} ../../dist/ \;

      - name: Generate .run installer (optional)
        run: |
          cd dist
          if [ -f *.ipk ]; then
            PKG=$(ls *.ipk | head -n 1)
            cat > install.sh <<'EOF'
          #!/bin/sh
          echo "Installing package on iStoreOS / OpenWrt ..."
          opkg install ./${PKG}
          echo "Installation completed!"
          EOF
            chmod +x install.sh
            cat install.sh ${PKG} > myapp-installer.run
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64
          path: dist/
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/*.run
            dist/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Dev Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          files: |
            dist/*.ipk
            dist/*.run
            dist/SHA256SUMS
          prerelease: true
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
