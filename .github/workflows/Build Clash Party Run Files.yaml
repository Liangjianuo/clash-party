name: Build OpenWrt/iStoreOS Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.0.0'

env:
  APP_ID: party.mihomo.app
  PRODUCT_NAME: Clash Party

jobs:
  build-openwrt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm64, x86_64, mipsel]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install -g pnpm
        pnpm install

    - name: Build Electron app
      run: |
        pnpm run build

    - name: Setup OpenWrt build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext wget unzip file

    - name: Build OpenWrt IPK
      run: |
        chmod +x ./scripts/build-openwrt-ipk.sh
        ./scripts/build-openwrt-ipk.sh "${{ matrix.arch }}" "${{ github.event.inputs.version || github.ref_name }}"

    - name: Upload IPK to release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: openwrt/package/clash-party/*.ipk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload IPK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: clash-party-ipk-${{ matrix.arch }}
        path: openwrt/package/clash-party/*.ipk
        retention-days: 30
