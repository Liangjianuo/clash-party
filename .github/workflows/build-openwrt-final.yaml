name: Build iStoreOS x86_64 Package

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issues.yml'
  workflow_dispatch:

permissions:
  write-all

jobs:
  cleanup-dev-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Dev Release Assets
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          echo "🔍 Looking for existing dev release..."
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/dev" | \
            jq -r '.id // empty')
          
          if [ ! -z "$RELEASE_ID" ] && [ "$RELEASE_ID" != "empty" ]; then
            echo "✅ Found dev release with ID: $RELEASE_ID"
            echo "🗑️ Deleting dev release..."
            curl -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "✅ Dev release deleted"
          else
            echo "ℹ️ No existing dev release found"
          fi

  build-istoreos-x86_64:
    needs: [cleanup-dev-release]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup OpenWRT build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext \
          zlib1g-dev swig unzip time rsync python3 python3-setuptools wget curl jq
        
    - name: Clone OpenWRT SDK for x86_64
      run: |
        # 使用更稳定的OpenWRT版本
        wget https://downloads.openwrt.org/releases/23.05.2/targets/x86/64/openwrt-sdk-23.05.2-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
        tar -xf openwrt-sdk-23.05.2-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
        mv openwrt-sdk-23.05.2-x86-64_gcc-12.3.0_musl.Linux-x86_64 openwrt-sdk
        cd openwrt-sdk
        
    - name: Create package directory structure
      run: |
        cd openwrt-sdk
        mkdir -p package/mihomo-party
        cat > package/mihomo-party/Makefile << 'EOF'
        include $(TOPDIR)/rules.mk

        PKG_NAME:=mihomo-party
        PKG_VERSION:=$(shell date +%Y%m%d%H%M%S)
        PKG_RELEASE:=1

        PKG_MAINTAINER:=Your Name <your@email.com>
        PKG_LICENSE:=MIT

        include $(INCLUDE_DIR)/package.mk

        define Package/mihomo-party
          SECTION:=net
          CATEGORY:=Network
          TITLE:=Mihomo Party Clash Client
          URL:=https://github.com/${{ github.repository }}
          DEPENDS:=+libc +libstdcpp +libopenssl
        endef

        define Package/mihomo-party/description
          A feature-rich Clash client for iStoreOS and OpenWRT systems.
        endef

        define Build/Prepare
          mkdir -p $(PKG_BUILD_DIR)
        endef

        define Build/Configure
          # Nothing to configure
        endef

        define Build/Compile
          # We'll download prebuilt binaries or build from source here
          echo "Building mihomo-party..."
        endef

        define Package/mihomo-party/install
          $(INSTALL_DIR) $(1)/usr/bin
          $(INSTALL_DIR) $(1)/etc/init.d
          $(INSTALL_DIR) $(1)/etc/config
          
          # Install binary (you'll need to provide this)
          $(INSTALL_BIN) ./files/mihomo-party $(1)/usr/bin/
          
          # Install init script
          $(INSTALL_BIN) ./files/mihomo-party.init $(1)/etc/init.d/mihomo-party
          
          # Install config
          $(INSTALL_CONF) ./files/mihomo-party.conf $(1)/etc/config/mihomo-party
        endef

        $(eval $(call BuildPackage,mihomo-party))
        EOF
        
        # Create package files directory
        mkdir -p package/mihomo-party/files
        
        # Create init script
        cat > package/mihomo-party/files/mihomo-party.init << 'EOF'
        #!/bin/sh /etc/rc.common

        START=99
        STOP=10

        start() {
            echo "Starting Mihomo Party"
            /usr/bin/mihomo-party --daemon
        }

        stop() {
            echo "Stopping Mihomo Party"
            killall mihomo-party
        }
        EOF
        
        # Create default config
        cat > package/mihomo-party/files/mihomo-party.conf << 'EOF'
        config mihomo-party 'main'
            option enabled '1'
            option port '9090'
            option log_level 'info'
        EOF
        
    - name: Download or build mihomo-party binary
      run: |
        cd openwrt-sdk/package/mihomo-party/files
        
        # 这里您需要提供实际的二进制文件
        # 可以是下载预编译版本，或者从源码编译
        echo "Downloading/compiling mihomo-party binary..."
        
        # 示例：下载预编译版本（请替换为实际URL）
        # wget -O mihomo-party https://github.com/your-repo/mihomo-party/releases/download/v1.0.0/mihomo-party-x86_64
        # chmod +x mihomo-party
        
        # 临时创建一个假的二进制文件用于测试
        cat > mihomo-party << 'EOF'
        #!/bin/sh
        echo "Mihomo Party - This is a placeholder binary"
        echo "Replace this with the actual compiled binary"
        exit 0
        EOF
        chmod +x mihomo-party
        
    - name: Build IPK package
      run: |
        cd openwrt-sdk
        # 更新 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 配置为只构建我们的包
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
        echo "CONFIG_PACKAGE_mihomo-party=y" >> .config
        
        # 禁用有问题的包
        echo "# CONFIG_PACKAGE_python3-pymysql is not set" >> .config
        
        make defconfig
        make package/mihomo-party/compile V=s -j$(nproc)
        
    - name: Collect built packages
      run: |
        cd openwrt-sdk
        mkdir -p ../dist
        find bin/packages -name "*.ipk" -exec cp {} ../dist/ \;
        echo "Built packages:"
        ls -la ../dist/
        
    - name: Generate checksums
      run: |
        cd dist
        for file in *; do
          if [ -f "$file" ]; then
            sha256sum "$file" > "$file.sha256"
          fi
        done
        echo "Checksums generated:"
        ls -la *.sha256
        
    - name: Upload Artifacts
      if: startsWith(github.ref, 'refs/heads/')
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-x86_64-ipk
        path: |
          dist/*.sha256
          dist/*.ipk
        if-no-files-found: error
        
    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.sha256
          dist/*.ipk
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Publish Dev Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dev
        files: |
          dist/*.sha256
          dist/*.ipk
        prerelease: true
        draft: false
        token: ${{ secrets.GITHUB_TOKEN }}

  # 可选：构建 RUN 格式的包（AppImage）
  build-run-package:
    needs: [cleanup-dev-release]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y fuse libfuse2 wget
        
    - name: Download AppImage tools
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        
    - name: Create AppImage structure
      run: |
        mkdir -p mihomo-party.AppDir/usr/bin
        mkdir -p mihomo-party.AppDir/usr/share/applications
        mkdir -p mihomo-party.AppDir/usr/share/icons/hicolor/256x256/apps
        
        # 这里需要提供实际的二进制文件
        # cp your-built-binary mihomo-party.AppDir/usr/bin/mihomo-party
        # chmod +x mihomo-party.AppDir/usr/bin/mihomo-party
        
        # 创建桌面文件
        cat > mihomo-party.AppDir/usr/share/applications/mihomo-party.desktop << EOF
        [Desktop Entry]
        Name=Mihomo Party
        Exec=AppRun
        Icon=mihomo-party
        Type=Application
        Categories=Network;
        EOF
        
        # 创建图标（需要提供实际图标文件）
        # cp assets/icon.png mihomo-party.AppDir/usr/share/icons/hicolor/256x256/apps/mihomo-party.png
        # cp assets/icon.png mihomo-party.AppDir/mihomo-party.png
        
        # 创建 AppRun 脚本
        cat > mihomo-party.AppDir/AppRun << 'EOF'
        #!/bin/bash
        HERE="\$(dirname "\$(readlink -f "\${0}")")"
        export PATH="\${HERE}/usr/bin:\${PATH}"
        export LD_LIBRARY_PATH="\${HERE}/usr/lib:\${LD_LIBRARY_PATH}"
        exec "\${HERE}/usr/bin/mihomo-party" "\$@"
        EOF
        chmod +x mihomo-party.AppDir/AppRun
        
    - name: Build AppImage
      run: |
        ./appimagetool-x86_64.AppImage mihomo-party.AppDir dist/mihomo-party-x86_64.AppImage
        
    - name: Generate checksums for AppImage
      run: |
        cd dist
        sha256sum *.AppImage > *.AppImage.sha256
        
    - name: Upload AppImage Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-x86_64-run
        path: |
          dist/*.AppImage
          dist/*.AppImage.sha256
        if-no-files-found: error

  telegram-notification:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-istoreos-x86_64, build-run-package]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        if: always()
        run: |
          echo "Build completed with status: ${{ job.status }}"
          # 这里可以添加 Telegram 通知逻辑
