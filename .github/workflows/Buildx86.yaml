name: Build iStoreOS x86_64 Package

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issues.yml'
  workflow_dispatch:

permissions:
  write-all

jobs:
  cleanup-dev-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Dev Release Assets
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          echo "🔍 Looking for existing dev release..."
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/dev" | \
            jq -r '.id // empty')
          
          if [ ! -z "$RELEASE_ID" ] && [ "$RELEASE_ID" != "empty" ]; then
            echo "✅ Found dev release with ID: $RELEASE_ID"
            echo "🗑️ Deleting dev release..."
            curl -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "✅ Dev release deleted"
          else
            echo "ℹ️ No existing dev release found"
          fi

  build-istoreos-x86_64:
    needs: [cleanup-dev-release]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package_type: [ipk, run]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup OpenWRT build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext \
          zlib1g-dev swig unzip time rsync python3 python3-setuptools
        
    - name: Clone OpenWRT SDK for x86_64
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt-src
        cd openwrt-src
        git checkout v23.05.2  # 使用稳定的OpenWRT版本
        
    - name: Setup iStoreOS feeds and configuration
      run: |
        cd openwrt-src
        # 添加iStoreOS相关源
        echo "src-git istore https://github.com/linkease/istore.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 配置为x86_64目标
        cat > .config << EOF
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_Generic=y
        EOF
        
        make defconfig
        
    - name: Build package dependencies
      run: |
        cd openwrt-src
        make package/symlinks
        # 根据您的实际包名调整
        make package/feeds/istore/mihomo-party/compile V=s
        
    - name: Build IPK package
      if: matrix.package_type == 'ipk'
      run: |
        cd openwrt-src
        # 构建IPK包
        make package/feeds/istore/mihomo-party/compile V=s
        # 复制生成的IPK文件
        mkdir -p ../dist
        find bin/packages -name "*.ipk" -exec cp {} ../dist/ \;
        
    - name: Build RUN package (AppImage format)
      if: matrix.package_type == 'run'
      run: |
        # 安装AppImage构建工具
        sudo apt-get install -y fuse libfuse2
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        
        # 创建AppImage目录结构
        mkdir -p mihomo-party.AppDir/usr/bin
        mkdir -p mihomo-party.AppDir/usr/share/applications
        mkdir -p mihomo-party.AppDir/usr/share/icons/hicolor/256x256/apps
        
        # 复制二进制文件和资源（根据您的实际项目结构调整）
        cp -r build/x86_64/* mihomo-party.AppDir/usr/bin/
        
        # 创建桌面文件
        cat > mihomo-party.AppDir/usr/share/applications/mihomo-party.desktop << EOF
        [Desktop Entry]
        Name=Mihomo Party
        Exec=AppRun
        Icon=mihomo-party
        Type=Application
        Categories=Network;
        EOF
        
        # 复制图标
        cp assets/icon.png mihomo-party.AppDir/usr/share/icons/hicolor/256x256/apps/mihomo-party.png
        cp assets/icon.png mihomo-party.AppDir/mihomo-party.png
        
        # 创建AppRun脚本
        cat > mihomo-party.AppDir/AppRun << 'EOF'
        #!/bin/bash
        HERE="$(dirname "$(readlink -f "${0}")")"
        export PATH="${HERE}/usr/bin:${PATH}"
        export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
        exec "${HERE}/usr/bin/mihomo-party" "$@"
        EOF
        chmod +x mihomo-party.AppDir/AppRun
        
        # 生成AppImage
        ./appimagetool-x86_64.AppImage mihomo-party.AppDir dist/mihomo-party-x86_64.AppImage
        
    - name: Generate checksums
      run: |
        cd dist
        for file in *; do
          if [ -f "$file" ]; then
            sha256sum "$file" > "$file.sha256"
          fi
        done
        
    - name: Upload Artifacts
      if: startsWith(github.ref, 'refs/heads/')
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-x86_64-${{ matrix.package_type }}
        path: |
          dist/*.sha256
          dist/*.ipk
          dist/*.AppImage
        if-no-files-found: error
        
    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.sha256
          dist/*.ipk
          dist/*.AppImage
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Publish Dev Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dev
        files: |
          dist/*.sha256
          dist/*.ipk
          dist/*.AppImage
        prerelease: true
        draft: false
        token: ${{ secrets.GITHUB_TOKEN }}

  build-istoreos-package:
    needs: [build-istoreos-x86_64]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        run: npm install -g pnpm
        
      - name: Install Dependencies
        run: |
          pnpm install
          # 添加iStoreOS构建依赖
          pnpm add -D @openwrt/build @istoreos/builder
          
      - name: Update Version for Dev Build
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        run: node scripts/update-version.mjs
        
      - name: Build iStoreOS Package
        run: |
          # 创建iStoreOS包目录结构
          mkdir -p istore-package/usr/bin
          mkdir -p istore-package/usr/share/mihomo-party
          mkdir -p istore-package/etc/init.d
          mkdir -p istore-package/etc/config
          
          # 复制二进制文件和资源
          cp -r build/x86_64/* istore-package/usr/bin/
          cp -r public istore-package/usr/share/mihomo-party/
          cp -r build/resources istore-package/usr/share/mihomo-party/
          
          # 创建OpenWRT init脚本
          cat > istore-package/etc/init.d/mihomo-party << 'EOF'
          #!/bin/sh /etc/rc.common
          START=99
          STOP=10
          
          start() {
              echo "Starting Mihomo Party"
              /usr/bin/mihomo-party --daemon
          }
          
          stop() {
              echo "Stopping Mihomo Party"
              killall mihomo-party
          }
          EOF
          chmod +x istore-package/etc/init.d/mihomo-party
          
          # 创建配置文件
          cat > istore-package/etc/config/mihomo-party << EOF
          config mihomo-party 'main'
              option enabled '1'
              option port '9090'
          EOF
          
      - name: Create IPK Control File
        run: |
          mkdir -p istore-package/CONTROL
          cat > istore-package/CONTROL/control << EOF
          Package: mihomo-party
          Version: $(node -p "require('./package.json').version")
          Depends: libc, libstdcpp
          Source: https://github.com/${{ github.repository }}
          Section: net
          Priority: optional
          Architecture: x86_64
          Installed-Size: $(du -sk istore-package/usr | cut -f1)
          Description: Mihomo Party - A clash client for iStoreOS
          Maintainer: pompurin404 <pompurin404@mihomo.party>
          EOF
          
      - name: Package IPK
        run: |
          # 使用OpenWRT的ipkg-build工具打包
          tar -czf dist/mihomo-party_$(node -p "require('./package.json').version")_x86_64.ipk -C istore-package .
          
      - name: Generate Package Checksums
        run: |
          cd dist
          sha256sum *.ipk > checksums.sha256
          
      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-Packages
          path: |
            dist/*.ipk
            dist/checksums.sha256
          if-no-files-found: error

  telegram-notification:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-istoreos-x86_64, build-istoreos-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        run: npm install -g pnpm
        
      - name: Install Dependencies
        run: pnpm install
        
      - name: Telegram Notification
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RELEASE_TYPE: release
        run: pnpm telegram
        
      - name: Telegram Dev Notification
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TYPE: dev
        run: pnpm telegram:dev
